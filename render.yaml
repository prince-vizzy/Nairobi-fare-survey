services:
  - type: web
    name: shii-ngapi
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GEMINI_API_KEY
        sync: false
      - key: PLACES_API_KEY
        sync: false
      - key: MAPS_API_KEY
        sync: false
